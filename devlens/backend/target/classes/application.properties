# DevLens Backend Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/devlens?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
devlens.jwt.secret=DevLensUltraSecureSecretKeyForJwtTokenGeneration2026WithHS256SignatureLongKey!
devlens.jwt.expiration-ms=86400000

# AI Integration Configuration (Module 4)
devlens.ai.provider=gemini
devlens.ai.gemini.model=gemini-1.5-flash
devlens.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
devlens.ai.openai.model=gpt-4o-mini
devlens.ai.openai.base-url=https://api.openai.com/v1
devlens.ai.timeout-ms=15000
devlens.ai.rate-limit.requests-per-minute=40

