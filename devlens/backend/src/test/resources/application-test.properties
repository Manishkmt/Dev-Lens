# DevLens Test Profile - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:devlenstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Security Test Configuration
devlens.jwt.secret=DevLensUltraSecureSecretKeyForJwtTokenGeneration2026WithHS256SignatureLongKey!
devlens.jwt.expiration-ms=86400000

# AI Test Configuration
devlens.ai.provider=mock
devlens.ai.gemini.model=gemini-1.5-flash
devlens.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
devlens.ai.openai.model=gpt-4o-mini
devlens.ai.openai.base-url=https://api.openai.com/v1
devlens.ai.timeout-ms=15000
devlens.ai.rate-limit.requests-per-minute=100

