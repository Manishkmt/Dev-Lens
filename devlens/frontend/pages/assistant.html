<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevLens - AI Code Assistant</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="dark">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content-wrapper">
      <div id="topbar-container"></div>

      <div class="page-container">
        <div class="content-inner" style="padding-bottom: 0;">
          <div class="chat-page-grid">
            <!-- Left: Sessions Sidebar -->
            <aside class="chat-sessions-sidebar">
              <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <span class="stat-label">Conversations</span>
                <button class="btn btn-sm btn-primary" id="new-chat-btn" style="height: 26px; padding: 0 8px; font-size: 11px;">
                  <span class="material-symbols-outlined" style="font-size: 14px;">add</span>
                  <span>New Chat</span>
                </button>
              </div>

              <!-- Sessions List -->
              <div id="sessions-list-container" style="flex: 1; overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 4px;">
                <!-- Populated dynamically via assistant.js -->
              </div>
            </aside>

            <!-- Right: Active Chat Stream & Input Dock -->
            <main class="chat-main-container">
              <!-- Header Strip -->
              <div style="padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border-color); background: var(--bg-lowest); display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <h3 style="font-size: 14px; font-weight: 600; color: var(--text-primary);" id="active-session-title">
                    BubbleSort Inversion & Optimization
                  </h3>
                  <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 2px;">
                    <span class="badge badge-ai" style="font-size: 10px; padding: 1px 6px;">
                      Context: BubbleSort.java [Java 17]
                    </span>
                    <span style="font-family: var(--font-code); font-size: 10px; color: var(--text-muted);">Lens-LLM v2.4</span>
                  </div>
                </div>

                <div style="display: flex; gap: 4px;">
                  <button class="btn btn-sm btn-ghost" id="clear-chat-btn" title="Clear conversation">
                    <span class="material-symbols-outlined" style="font-size: 16px;">delete_sweep</span>
                  </button>
                </div>
              </div>

              <!-- Chat Message History -->
              <div class="chat-messages-stream" id="chat-messages-stream">
                <!-- Messages populated dynamically -->
              </div>

              <!-- Typing Indicator (Hidden by default) -->
              <div id="typing-indicator" style="display: none; padding: 0 1.5rem 0.5rem; font-size: 12px; color: var(--text-muted); align-items: center; gap: 6px;">
                <span class="animate-spin material-symbols-outlined" style="font-size: 14px; color: var(--color-secondary);">sync</span>
                <span>DevLens AI is reasoning...</span>
              </div>

              <!-- Input Dock -->
              <div class="chat-input-bar">
                <!-- Quick Prompts Chips -->
                <div class="quick-prompts-row" id="quick-prompts-row">
                  <span class="prompt-chip" data-prompt="Why does line 9 need a temporary variable during swap?">Why need temp?</span>
                  <span class="prompt-chip" data-prompt="How does the swapped boolean flag achieve O(n) best-case?">Explain early exit</span>
                  <span class="prompt-chip" data-prompt="Show me how to guard against NullPointerException in bubbleSort.">Add null guard</span>
                  <span class="prompt-chip" data-prompt="Can we convert the outer for loop into an equivalent while loop?">Convert to while loop</span>
                </div>

                <!-- Input Box -->
                <form id="chat-form" style="display: flex; gap: 0.5rem; align-items: flex-end;">
                  <textarea id="chat-input-textarea" class="form-textarea" placeholder="Ask anything about your code, asymptotic complexity, or viva preparation..." style="min-height: 48px; max-height: 120px; resize: none; margin: 0; padding: 0.6rem 0.85rem;" rows="1"></textarea>
                  <button type="submit" class="btn btn-primary btn-icon" id="chat-send-btn" style="flex-shrink: 0; width: 44px; height: 44px;">
                    <span class="material-symbols-outlined">send</span>
                  </button>
                </form>
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/assistant.js"></script>
</body>
</html>
